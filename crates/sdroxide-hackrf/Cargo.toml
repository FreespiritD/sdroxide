[package]
name = "sdroxide-hackrf"
version.workspace = true
edition.workspace = true

# Native-only HackRF One (and Jawbreaker / rad1o) support over USB. Pure Rust
# via `nusb` — no libusb, no libhackrf, no libSoapySDR, no C dependency at all.
# Must never be a dependency of any wasm-targeted crate.
[dependencies]
# `HackRfConfig` — including the offered sample-rate list, which lives there
# rather than here because the settings UI is shared with the wasm client.
sdroxide-types.workspace = true
# For `Complex32`, which is what the whole workspace passes baseband in.
sdroxide-dsp.workspace = true
crossbeam-channel.workspace = true
rtrb.workspace = true
thiserror.workspace = true
tracing.workspace = true
nusb.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
