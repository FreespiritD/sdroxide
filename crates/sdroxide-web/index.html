<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sdroxide</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="copy-file" href="assets/audio_bridge.js" />
    <link data-trunk rel="copy-file" href="assets/pcm_worklet.js" />
    <link data-trunk rel="copy-file" href="assets/ws_arraybuffer.js" />
    <!-- Must run before the wasm opens its socket. -->
    <script src="ws_arraybuffer.js"></script>
    <script src="audio_bridge.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
            /* A drag across the canvas is a waterfall pan, not a text
               selection. Without this WebKit starts selecting the document and
               washes the whole page in the blue selection tint. */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            /* No rubber-banding or pull-to-refresh on a full-screen app. */
            overscroll-behavior: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            /* Every gesture belongs to egui: no panning, pinch-zoom or
               double-tap-zoom stolen by the browser. */
            touch-action: none;
        }
        /* eframe drives the on-screen keyboard through a hidden input, which
           still needs real selection to edit text in. */
        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>
    <canvas id="sdroxide_canvas"></canvas>
</body>
</html>
